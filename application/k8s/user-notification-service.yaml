apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-notification-service
  labels:
    app: user-notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-notification-service
  template:
    metadata:
      labels:
        app: user-notification-service
    spec:
      containers:
      - name: user-notification-service
        image: 137068226927.dkr.ecr.eu-central-1.amazonaws.com/user-notification-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-notification-service
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
  selector:
    app: user-notification-service
